<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-label="Explore the Talent Marketplace" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><title>Explore the Talent Marketplace</title><rect x="0.5" y="0.5" width="959" height="527" rx="16" fill="#ffffff" stroke="#e2ddd7"/><text x="24" y="40" font-size="20" font-weight="700" fill="#1d2329">Explore the Talent Marketplace</text><text x="24" y="66" font-size="13.5" fill="#3c444c">Empowering people to drive their professional development, fuelling the shift towards a more dynamic and fulfilling future of work. AI</text><text x="24" y="86" font-size="13.5" fill="#3c444c">talent matching makes sure the right skills are assigned to the right projects, connects jobs and job seekers across the network, and brings</text><text x="24" y="106" font-size="13.5" fill="#3c444c">project-based and gig work into the partner ecosystem's talent strategy.</text><rect x="24.0" y="136" width="172.8" height="178" rx="14" fill="#e3eef8"/><circle cx="58.0" cy="168" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(58.0,168)"><path d="M-5,4 c-3,-2 -5,-5 -5,-8 a10,10 0 0 1 20,0 c0,3 -2,6 -5,8 v3 h-10 z M-3,10 h6" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40.0" y="210" font-size="14" font-weight="700" fill="#1d2329">Project opportunities</text><text x="40.0" y="230" font-size="12" fill="#3c444c">Find projects, gigs and</text><text x="40.0" y="246" font-size="12" fill="#3c444c">contracts where you can</text><text x="40.0" y="262" font-size="12" fill="#3c444c">apply your talent and</text><text x="40.0" y="278" font-size="12" fill="#3c444c">learn new skills.</text><rect x="208.8" y="136" width="172.8" height="178" rx="14" fill="#fbefdc"/><circle cx="242.8" cy="168" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(242.8,168)"><path d="M-11,-2 L0,-7 L11,-2 L0,3 Z" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6,0.5 v5 c0,3 12,3 12,0 v-5" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="224.8" y="210" font-size="14" font-weight="700" fill="#1d2329">Continuous learning</text><text x="224.8" y="230" font-size="12" fill="#3c444c">Explore online and in-</text><text x="224.8" y="246" font-size="12" fill="#3c444c">person courses, workshops</text><text x="224.8" y="262" font-size="12" fill="#3c444c">and mock projects to grow</text><text x="224.8" y="278" font-size="12" fill="#3c444c">your skills.</text><rect x="393.6" y="136" width="172.8" height="178" rx="14" fill="#e1f1ea"/><circle cx="427.6" cy="168" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(427.6,168)"><circle r="10" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-4 L-2,-2 L-4,4 L2,2 Z" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="409.6" y="210" font-size="14" font-weight="700" fill="#1d2329">Coaches</text><text x="409.6" y="230" font-size="12" fill="#3c444c">Find coaches and mentors</text><text x="409.6" y="246" font-size="12" fill="#3c444c">who can guide and support</text><text x="409.6" y="262" font-size="12" fill="#3c444c">you in your career.</text><rect x="578.4" y="136" width="172.8" height="178" rx="14" fill="#fbe4e2"/><circle cx="612.4" cy="168" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(612.4,168)"><circle cx="-3" cy="-4" r="3.6" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11,8 c0,-6 16,-6 16,0" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7,-3 h6 M10,-6 v6" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="594.4" y="210" font-size="14" font-weight="700" fill="#1d2329">Welcome new members</text><text x="594.4" y="230" font-size="12" fill="#3c444c">Say hello to members who</text><text x="594.4" y="246" font-size="12" fill="#3c444c">have just joined.</text><rect x="763.2" y="136" width="172.8" height="178" rx="14" fill="#ece7f6"/><circle cx="797.2" cy="168" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(797.2,168)"><path d="M-9,-3 h14 v6 a6,6 0 0 1 -6,6 h-2 a6,6 0 0 1 -6,-6 z M5,-1 h2 a3,3 0 0 1 0,6 h-2 M-5,-10 v3 M0,-10 v3" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="779.2" y="210" font-size="14" font-weight="700" fill="#1d2329">Meetups</text><text x="779.2" y="230" font-size="12" fill="#3c444c">Chapter meetups in cities</text><text x="779.2" y="246" font-size="12" fill="#3c444c">near you: meet members</text><text x="779.2" y="262" font-size="12" fill="#3c444c">and connect over a casual</text><text x="779.2" y="278" font-size="12" fill="#3c444c">chat.</text><rect x="24.0" y="326" width="172.8" height="178" rx="14" fill="#e3eef8"/><circle cx="58.0" cy="358" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(58.0,358)"><rect x="-9" y="-7" width="18" height="16" rx="2" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9,-2 h18 M-4,-10 v5 M4,-10 v5" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="40.0" y="400" font-size="14" font-weight="700" fill="#1d2329">Events</text><text x="40.0" y="420" font-size="12" fill="#3c444c">Join talks, workshops and</text><text x="40.0" y="436" font-size="12" fill="#3c444c">celebrations across</text><text x="40.0" y="452" font-size="12" fill="#3c444c">chapters.</text><rect x="208.8" y="326" width="172.8" height="178" rx="14" fill="#e1f1ea"/><circle cx="242.8" cy="358" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(242.8,358)"><path d="M0,8 C-13,0 -8,-10 0,-4 C8,-10 13,0 0,8 Z" fill="#2f6f8f"/></g><text x="224.8" y="400" font-size="14" font-weight="700" fill="#1d2329">Volunteering</text><text x="224.8" y="420" font-size="12" fill="#3c444c">Give back through service</text><text x="224.8" y="436" font-size="12" fill="#3c444c">drives, yoga, meditation</text><text x="224.8" y="452" font-size="12" fill="#3c444c">and wellbeing sessions.</text><rect x="393.6" y="326" width="172.8" height="178" rx="14" fill="#fbefdc"/><circle cx="427.6" cy="358" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(427.6,358)"><rect x="-9" y="-4" width="18" height="12" rx="2" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-3,-4 v-3 h6 v3 M-9,1 h18" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="409.6" y="400" font-size="14" font-weight="700" fill="#1d2329">Jobs</text><text x="409.6" y="420" font-size="12" fill="#3c444c">Browse all full-time,</text><text x="409.6" y="436" font-size="12" fill="#3c444c">part-time and internship</text><text x="409.6" y="452" font-size="12" fill="#3c444c">roles.</text><rect x="578.4" y="326" width="172.8" height="178" rx="14" fill="#fbe4e2"/><circle cx="612.4" cy="358" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(612.4,358)"><path d="M-9,-3 h4 l9,-6 v18 l-9,-6 h-4 z M-6,3 l2,6" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="594.4" y="400" font-size="14" font-weight="700" fill="#1d2329">Community</text><text x="594.4" y="418" font-size="14" font-weight="700" fill="#1d2329">announcements</text><text x="594.4" y="438" font-size="12" fill="#3c444c">News and updates from the</text><text x="594.4" y="454" font-size="12" fill="#3c444c">team and your chapters.</text><rect x="763.2" y="326" width="172.8" height="178" rx="14" fill="#ece7f6"/><circle cx="797.2" cy="358" r="18" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(797.2,358)"><path d="M-8,8 C-8,-6 2,-10 9,-9 C10,-2 6,8 -8,8 Z M-8,8 L3,-3" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="779.2" y="400" font-size="14" font-weight="700" fill="#1d2329">Community wellbeing</text><text x="779.2" y="420" font-size="12" fill="#3c444c">Yoga, meditation, Art of</text><text x="779.2" y="436" font-size="12" fill="#3c444c">Living and workshops for</text><text x="779.2" y="452" font-size="12" fill="#3c444c">personal growth.</text></svg>
