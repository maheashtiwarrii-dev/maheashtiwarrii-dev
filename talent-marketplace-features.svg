<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-label="Talent Marketplace Solution: key features and AI capabilities" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><title>Talent Marketplace Solution: key features and AI capabilities</title><rect x="0.5" y="0.5" width="959" height="751" rx="16" fill="#ffffff" stroke="#e4e1dd"/><text x="24" y="40" font-size="20" font-weight="700" fill="#201e1c">Key Features &amp; Capabilities</text><rect x="24.0" y="56" width="294.7" height="124" rx="14" fill="#e7f2f5"/><circle cx="60.0" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(60.0,90)"><path d="M-8,-7 h16 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-8 l-5,4 v-4 h-3 a3,3 0 0 1 -3,-3 v-7 a3,3 0 0 1 3,-3 z" fill="none" stroke="#8d4f2e" stroke-width="1.8" stroke-linejoin="round"/></g><text x="42.0" y="132" font-size="15" font-weight="700" fill="#201e1c">Coaching</text><text x="42.0" y="153" font-size="12.5" fill="#47423e">Access to personalized coaching</text><text x="42.0" y="170" font-size="12.5" fill="#47423e">opportunities</text><rect x="332.7" y="56" width="294.7" height="124" rx="14" fill="#fcedd9"/><circle cx="368.7" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(368.7,90)"><path d="M-11,-2 L0,-7 L11,-2 L0,3 Z" fill="none" stroke="#8d4f2e" stroke-width="1.8" stroke-linejoin="round"/><path d="M-6,0.5 v5 c0,3 12,3 12,0 v-5" fill="none" stroke="#8d4f2e" stroke-width="1.8"/></g><text x="350.7" y="132" font-size="15" font-weight="700" fill="#201e1c">Continuous Learning</text><text x="350.7" y="153" font-size="12.5" fill="#47423e">Curated learning pathways and resources for</text><text x="350.7" y="170" font-size="12.5" fill="#47423e">ongoing skill development</text><rect x="641.3" y="56" width="294.7" height="124" rx="14" fill="#e8f1f0"/><circle cx="677.3" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(677.3,90)"><circle cx="-3" cy="-4" r="3.2" fill="none" stroke="#8d4f2e" stroke-width="1.8"/><path d="M-10,8 c0,-6 14,-6 14,0" fill="none" stroke="#8d4f2e" stroke-width="1.8"/><circle cx="6" cy="-3" r="2.6" fill="none" stroke="#8d4f2e" stroke-width="1.8"/><path d="M5,4 c3,0 6,1.5 6,4" fill="none" stroke="#8d4f2e" stroke-width="1.8"/></g><text x="659.3" y="132" font-size="15" font-weight="700" fill="#201e1c">Mentoring</text><text x="659.3" y="153" font-size="12.5" fill="#47423e">Structured mentoring connections between</text><text x="659.3" y="170" font-size="12.5" fill="#47423e">members</text><rect x="24.0" y="194" width="294.7" height="124" rx="14" fill="#fbecef"/><circle cx="60.0" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(60.0,228)"><rect x="-9" y="-4" width="18" height="12" rx="2" fill="none" stroke="#8d4f2e" stroke-width="1.8"/><path d="M-3,-4 v-3 h6 v3 M-9,1 h18" fill="none" stroke="#8d4f2e" stroke-width="1.8"/></g><text x="42.0" y="270" font-size="15" font-weight="700" fill="#201e1c">Job Discovery</text><text x="42.0" y="291" font-size="12.5" fill="#47423e">AI-driven job matching based on individual</text><text x="42.0" y="308" font-size="12.5" fill="#47423e">skills and profiles</text><rect x="332.7" y="194" width="294.7" height="124" rx="14" fill="#f5ecfb"/><circle cx="368.7" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(368.7,228)"><path d="M-9,7 h18 M-8,4 l5,-6 l4,3 l7,-8" fill="none" stroke="#8d4f2e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-7 h4.5 v4.5" fill="none" stroke="#8d4f2e" stroke-width="1.8" stroke-linecap="round"/></g><text x="350.7" y="270" font-size="15" font-weight="700" fill="#201e1c">Skills Center</text><text x="350.7" y="291" font-size="12.5" fill="#47423e">Centralized hub for skill assessment,</text><text x="350.7" y="308" font-size="12.5" fill="#47423e">development, and showcase</text><rect x="641.3" y="194" width="294.7" height="124" rx="14" fill="#e7f2f5"/><circle cx="677.3" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(677.3,228)"><path d="M0,8 C-13,0 -8,-10 0,-4 C8,-10 13,0 0,8 Z" fill="#8d4f2e"/></g><text x="659.3" y="270" font-size="15" font-weight="700" fill="#201e1c">Volunteering</text><text x="659.3" y="291" font-size="12.5" fill="#47423e">Opportunities to give back through</text><text x="659.3" y="308" font-size="12.5" fill="#47423e">volunteering and community initiatives</text><text x="24" y="348" font-size="13.5" fill="#201e1c">The platform leverages AI agents and intelligent recommendations to deliver a seamless, personalized experience across these areas.</text><text x="24" y="392" font-size="18" font-weight="700" fill="#201e1c">AI capabilities</text><text x="36" y="420" font-size="12" font-weight="600" fill="#47423e">Capability</text><text x="274" y="420" font-size="12" font-weight="600" fill="#47423e">What it does</text><rect x="24" y="430" width="912" height="32" rx="10" fill="#e7f2f5"/><text x="36" y="451" font-size="13" font-weight="700" fill="#201e1c">Smart matching</text><text x="274" y="451" font-size="13" fill="#47423e">Tags roles where a member holds half the skills "Matched to you"</text><rect x="24" y="468" width="912" height="32" rx="10" fill="#fcedd9"/><text x="36" y="489" font-size="13" font-weight="700" fill="#201e1c">Recommendations</text><text x="274" y="489" font-size="13" fill="#47423e">Ranks jobs, gigs, learning and mentors; each says why</text><rect x="24" y="506" width="912" height="32" rx="10" fill="#e8f1f0"/><text x="36" y="527" font-size="13" font-weight="700" fill="#201e1c">Your skills vs this role</text><text x="274" y="527" font-size="13" fill="#47423e">Lists each skill a role asks for, whether the member has it, and training that builds a missing one</text><rect x="24" y="544" width="912" height="32" rx="10" fill="#fbecef"/><text x="36" y="565" font-size="13" font-weight="700" fill="#201e1c">Skills advisor for members</text><text x="274" y="565" font-size="13" fill="#47423e">Suggests skills from the member's own words and open roles; members tick, rate and add them</text><rect x="24" y="582" width="912" height="32" rx="10" fill="#f5ecfb"/><text x="36" y="603" font-size="13" font-weight="700" fill="#201e1c">Skills advisor for postings</text><text x="274" y="603" font-size="13" fill="#47423e">Suggests skills from a job, gig or partner need's title and description</text><rect x="24" y="620" width="912" height="32" rx="10" fill="#e7f2f5"/><text x="36" y="641" font-size="13" font-weight="700" fill="#201e1c">Skills advisor for learning</text><text x="274" y="641" font-size="13" fill="#47423e">Suggests learning outcomes and shows admins which skills have no training yet</text><rect x="24" y="658" width="912" height="32" rx="10" fill="#fcedd9"/><text x="36" y="679" font-size="13" font-weight="700" fill="#201e1c">Suggested members</text><text x="274" y="679" font-size="13" fill="#47423e">Suggests members to role managers, within privacy rules</text><rect x="24" y="696" width="912" height="32" rx="10" fill="#e8f1f0"/><text x="36" y="717" font-size="13" font-weight="700" fill="#201e1c">Ask agent</text><text x="274" y="717" font-size="13" fill="#47423e">Answers plain-language questions on any page</text></svg>
