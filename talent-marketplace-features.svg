<svg xmlns="http://www.w3.org/2000/svg" width="960" height="752" viewBox="0 0 960 752" role="img" aria-label="Talent Marketplace Solution: key features and AI capabilities" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"><title>Talent Marketplace Solution: key features and AI capabilities</title><rect x="0.5" y="0.5" width="959" height="751" rx="16" fill="#ffffff" stroke="#e2ddd7"/><text x="24" y="40" font-size="20" font-weight="700" fill="#1d2329">Key Features &amp; Capabilities</text><rect x="24.0" y="56" width="294.7" height="124" rx="14" fill="#e3eef8"/><circle cx="60.0" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(60.0,90)"><path d="M-8,-7 h16 a3,3 0 0 1 3,3 v7 a3,3 0 0 1 -3,3 h-8 l-5,4 v-4 h-3 a3,3 0 0 1 -3,-3 v-7 a3,3 0 0 1 3,-3 z" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linejoin="round"/></g><text x="42.0" y="132" font-size="15" font-weight="700" fill="#1d2329">Coaching</text><text x="42.0" y="153" font-size="12.5" fill="#3c444c">Access to personalized coaching</text><text x="42.0" y="170" font-size="12.5" fill="#3c444c">opportunities</text><rect x="332.7" y="56" width="294.7" height="124" rx="14" fill="#fbefdc"/><circle cx="368.7" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(368.7,90)"><path d="M-11,-2 L0,-7 L11,-2 L0,3 Z" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linejoin="round"/><path d="M-6,0.5 v5 c0,3 12,3 12,0 v-5" fill="none" stroke="#2f6f8f" stroke-width="1.8"/></g><text x="350.7" y="132" font-size="15" font-weight="700" fill="#1d2329">Continuous Learning</text><text x="350.7" y="153" font-size="12.5" fill="#3c444c">Curated learning pathways and resources for</text><text x="350.7" y="170" font-size="12.5" fill="#3c444c">ongoing skill development</text><rect x="641.3" y="56" width="294.7" height="124" rx="14" fill="#e1f1ea"/><circle cx="677.3" cy="90" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(677.3,90)"><circle cx="-3" cy="-4" r="3.2" fill="none" stroke="#2f6f8f" stroke-width="1.8"/><path d="M-10,8 c0,-6 14,-6 14,0" fill="none" stroke="#2f6f8f" stroke-width="1.8"/><circle cx="6" cy="-3" r="2.6" fill="none" stroke="#2f6f8f" stroke-width="1.8"/><path d="M5,4 c3,0 6,1.5 6,4" fill="none" stroke="#2f6f8f" stroke-width="1.8"/></g><text x="659.3" y="132" font-size="15" font-weight="700" fill="#1d2329">Mentoring</text><text x="659.3" y="153" font-size="12.5" fill="#3c444c">Structured mentoring connections between</text><text x="659.3" y="170" font-size="12.5" fill="#3c444c">members</text><rect x="24.0" y="194" width="294.7" height="124" rx="14" fill="#fbe4e2"/><circle cx="60.0" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(60.0,228)"><rect x="-9" y="-4" width="18" height="12" rx="2" fill="none" stroke="#2f6f8f" stroke-width="1.8"/><path d="M-3,-4 v-3 h6 v3 M-9,1 h18" fill="none" stroke="#2f6f8f" stroke-width="1.8"/></g><text x="42.0" y="270" font-size="15" font-weight="700" fill="#1d2329">Job Discovery</text><text x="42.0" y="291" font-size="12.5" fill="#3c444c">AI-driven job matching based on individual</text><text x="42.0" y="308" font-size="12.5" fill="#3c444c">skills and profiles</text><rect x="332.7" y="194" width="294.7" height="124" rx="14" fill="#ece7f6"/><circle cx="368.7" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(368.7,228)"><path d="M-9,7 h18 M-8,4 l5,-6 l4,3 l7,-8" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4,-7 h4.5 v4.5" fill="none" stroke="#2f6f8f" stroke-width="1.8" stroke-linecap="round"/></g><text x="350.7" y="270" font-size="15" font-weight="700" fill="#1d2329">Skills Center</text><text x="350.7" y="291" font-size="12.5" fill="#3c444c">Centralized hub for skill assessment,</text><text x="350.7" y="308" font-size="12.5" fill="#3c444c">development, and showcase</text><rect x="641.3" y="194" width="294.7" height="124" rx="14" fill="#e3eef8"/><circle cx="677.3" cy="228" r="19" fill="#ffffff" fill-opacity="0.8"/><g transform="translate(677.3,228)"><path d="M0,8 C-13,0 -8,-10 0,-4 C8,-10 13,0 0,8 Z" fill="#2f6f8f"/></g><text x="659.3" y="270" font-size="15" font-weight="700" fill="#1d2329">Volunteering</text><text x="659.3" y="291" font-size="12.5" fill="#3c444c">Opportunities to give back through</text><text x="659.3" y="308" font-size="12.5" fill="#3c444c">volunteering and community initiatives</text><text x="24" y="348" font-size="13.5" fill="#1d2329">The platform leverages AI agents and intelligent recommendations to deliver a seamless, personalized experience across these areas.</text><text x="24" y="392" font-size="18" font-weight="700" fill="#1d2329">AI capabilities</text><text x="36" y="420" font-size="12" font-weight="600" fill="#3c444c">Capability</text><text x="274" y="420" font-size="12" font-weight="600" fill="#3c444c">What it does</text><rect x="24" y="430" width="912" height="32" rx="10" fill="#e3eef8"/><text x="36" y="451" font-size="13" font-weight="700" fill="#1d2329">Smart matching</text><text x="274" y="451" font-size="13" fill="#3c444c">Tags roles where a member holds half the skills "Matched to you"</text><rect x="24" y="468" width="912" height="32" rx="10" fill="#fbefdc"/><text x="36" y="489" font-size="13" font-weight="700" fill="#1d2329">Recommendations</text><text x="274" y="489" font-size="13" fill="#3c444c">Ranks jobs, gigs, learning and mentors; each says why</text><rect x="24" y="506" width="912" height="32" rx="10" fill="#e1f1ea"/><text x="36" y="527" font-size="13" font-weight="700" fill="#1d2329">Your skills vs this role</text><text x="274" y="527" font-size="13" fill="#3c444c">Lists each skill a role asks for, whether the member has it, and training that builds a missing one</text><rect x="24" y="544" width="912" height="32" rx="10" fill="#fbe4e2"/><text x="36" y="565" font-size="13" font-weight="700" fill="#1d2329">Skills advisor for members</text><text x="274" y="565" font-size="13" fill="#3c444c">Suggests skills from the member's own words and open roles; members tick, rate and add them</text><rect x="24" y="582" width="912" height="32" rx="10" fill="#ece7f6"/><text x="36" y="603" font-size="13" font-weight="700" fill="#1d2329">Skills advisor for postings</text><text x="274" y="603" font-size="13" fill="#3c444c">Suggests skills from a job, gig or partner need's title and description</text><rect x="24" y="620" width="912" height="32" rx="10" fill="#e3eef8"/><text x="36" y="641" font-size="13" font-weight="700" fill="#1d2329">Skills advisor for learning</text><text x="274" y="641" font-size="13" fill="#3c444c">Suggests learning outcomes and shows admins which skills have no training yet</text><rect x="24" y="658" width="912" height="32" rx="10" fill="#fbefdc"/><text x="36" y="679" font-size="13" font-weight="700" fill="#1d2329">Suggested members</text><text x="274" y="679" font-size="13" fill="#3c444c">Suggests members to role managers, within privacy rules</text><rect x="24" y="696" width="912" height="32" rx="10" fill="#e1f1ea"/><text x="36" y="717" font-size="13" font-weight="700" fill="#1d2329">Ask agent</text><text x="274" y="717" font-size="13" fill="#3c444c">Answers plain-language questions on any page</text></svg>
